name: Build, Push & Deploy

on:
  push:
    branches: [dev]

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: dummy-app

jobs:
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version_tag }}

    steps:
      - name: Log — pipeline started
        run: |
          echo "=========================================="
          echo "  Pipeline triggered"
          echo "  Repo    : ${{ github.repository }}"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Actor   : ${{ github.actor }}"
          echo "  Run #   : ${{ github.run_number }}"
          echo "=========================================="

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log — code checked out
        run: |
          echo "Checked out commit: ${{ github.sha }}"
          echo "Files in workspace:"
          ls -la

      - name: Generate version tag
        id: meta
        run: |
          TAG="v$(date +'%Y.%m.%d').${{ github.run_number }}"
          echo "version_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag generated: $TAG"
          echo "Full image refs:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Log — ACR login successful
        run: echo "Logged in to ACR: ${{ env.REGISTRY }}"

      - name: Build Docker image
        run: |
          echo "Building image..."
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version_tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          echo "Build complete."
          docker images | grep ${{ env.IMAGE_NAME }}

      - name: Push Docker image
        run: |
          echo "Pushing versioned tag: ${{ steps.meta.outputs.version_tag }}"
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version_tag }}
          echo "Versioned tag pushed."

          echo "Pushing latest tag..."
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "Latest tag pushed."

      - name: Log — build-and-push complete
        run: |
          echo "=========================================="
          echo "  Image published to ACR"
          echo "  Tag     : ${{ steps.meta.outputs.version_tag }}"
          echo "  Latest  : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "=========================================="

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Log — deploy job started
        run: |
          echo "=========================================="
          echo "  Starting deployment"
          echo "  Image tag : ${{ needs.build-and-push.outputs.image_tag }}"
          echo "  Target VM : ${{ secrets.VM_SSH_HOST }}"
          echo "=========================================="

      - name: SSH into VM and run deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            echo "=========================================="
            echo "  Connected to VM: $(hostname)"
            echo "  Deploying image: ${{ needs.build-and-push.outputs.image_tag }}"
            echo "=========================================="

            export DEPLOY_PATH="/home/azureuser/dev/elie-platform/ai/backend"
            export GITHUB_PAT_RISHABH="${{ secrets.GITHUB_PAT_RISHABH }}"
            export REGISTRY="${{ secrets.ACR_LOGIN_SERVER }}"
            export IMAGE_NAME="dummy-app"
            export APP_VERSION="${{ needs.build-and-push.outputs.image_tag }}"

            echo "Running deploy script..."
            bash $DEPLOY_PATH/scripts/deploy.sh

            echo "Deploy script finished. Current containers:"
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

      - name: Log — deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment SUCCEEDED for tag: ${{ needs.build-and-push.outputs.image_tag }}"
          else
            echo "Deployment FAILED for tag: ${{ needs.build-and-push.outputs.image_tag }}"
            echo "Check VM logs: tail -50 /var/log/deploy.log"
          fi
